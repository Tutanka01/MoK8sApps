apiVersion: apps/v1
kind: Deployment
metadata:
  name: miam
  labels:
    app.kubernetes.io/name: miam
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: miam
  template:
    metadata:
      labels:
        app.kubernetes.io/name: miam
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: miam
          image: tutanka01/miam:0.1.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: REDIS_URL
              value: redis://redis:6379
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
