apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pouet
  labels:
    app.kubernetes.io/name: pouet
spec:
  rules:
    - host: pouet.demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pouet
                port:
                  name: http
