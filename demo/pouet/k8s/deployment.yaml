apiVersion: apps/v1
kind: Deployment
metadata:
  name: pouet
  labels:
    app.kubernetes.io/name: pouet
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: pouet
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pouet
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pouet
          image: tutanka01/pouet:0.1.0
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
