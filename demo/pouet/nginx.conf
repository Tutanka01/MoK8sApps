server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Tells the browser which pod served the request.
    location = /whoami {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        # Close the connection so the next request can land on another pod.
        keepalive_timeout 0;
        return 200 '{"pod":"$hostname","time":"$time_iso8601"}';
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
