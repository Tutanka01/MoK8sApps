# Needs metrics-server in the cluster.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kaboom
  labels:
    app.kubernetes.io/name: kaboom
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kaboom
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
