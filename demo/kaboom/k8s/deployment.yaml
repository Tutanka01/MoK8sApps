apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaboom
  labels:
    app.kubernetes.io/name: kaboom
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kaboom
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kaboom
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kaboom
          image: tutanka01/kaboom:0.1.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: "1"
              # Four "Gaver de RAM" clicks (4 x 64 MiB) cross this and get the pod OOMKilled.
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
