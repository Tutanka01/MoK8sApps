apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kaboom
  labels:
    app.kubernetes.io/name: kaboom
spec:
  rules:
    - host: kaboom.demo.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kaboom
                port:
                  name: http
